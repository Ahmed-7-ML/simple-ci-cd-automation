# The name of your workflow
name: Simple CI

# Trigger -> Events
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Tasks to do when Trigger is ON
jobs: 
  # Task Name
  test: 
    # The type of machine to run the job on -> VM on Github
    runs-on: ubuntu-latest
    steps:
      # Load my code from repo into server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      # Install Libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Code Linting with Ruff
      - name: Lint with Ruff
        run: ruff check

      # Run PyTest
      - name: Run Tests
        run: pytest -v    # v = verbose
