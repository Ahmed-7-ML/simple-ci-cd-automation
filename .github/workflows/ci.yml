name: Simple CI # The name of your workflow.

on: # Trigger
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs: # Tasks to do when Trigger is ON
  test: # Task Name
    runs-on: ubuntu-latest  # The type of machine to run the job on.
    steps:
      # Load my code from repo into server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      # Install Libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run PyTest
      - name: Run Tests
        run: pytest -v    # v = verbose
